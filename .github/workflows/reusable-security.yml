name: Security (reusable)
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner to execute on
        type: string
        default: ubuntu-latest
permissions:
  contents: read
  security-events: write
jobs:
  probe:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - run: echo probe

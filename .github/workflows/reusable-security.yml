---
name: Security (reusable)

# Reusable security pipeline for hidden-tokens repositories.
#
# Usage from a repository's own workflow:
#
#   name: Security
#   on:
#     push: { branches: [main] }
#     pull_request:
#   permissions:
#     contents: read
#     pull-requests: read
#     security-events: write
#   jobs:
#     security:
#       uses: hidden-tokens/.github/.github/workflows/reusable-security.yml@main
#       with:
#         codeql-languages: typescript,javascript
#
# Free-tier only: no GitHub Advanced Security required for secret scanning
# (Trufflehog) or dependency review. CodeQL is free for public repositories.
#
# PERMISSIONS CONTRACT (learned hard way, 2026-10-28):
#   A reusable workflow (workflow_call-only) must NOT declare `pull-requests`
#   in its own permissions block — GitHub rejects the whole workflow at
#   validation with an undiagnosable 'startup_failure'. The CALLER grants
#   `pull-requests: read` (needed by the dependency-review job) and it
#   cascades into the called workflow.
#
# Calls on private repositories: CodeQL needs GHAS — leave codeql-languages
# empty to skip it. Trufflehog and dependency review work everywhere.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner to execute on
        type: string
        default: ubuntu-latest
      codeql-languages:
        description: Comma-separated languages for CodeQL analysis — empty string skips CodeQL
        type: string
        default: ""
      codeql-queries:
        description: Additional CodeQL query set (security-extended, security-and-quality)
        type: string
        default: security-extended

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan (Trufflehog)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # pins v5
        with:
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@0301dc36bd6762d2a20a8317ae00375eb5ba90a9  # pins main
        with:
          path: ./
          # PRs: scan pull-request diff. Push: scan full history.
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          extra_args: --only-verified

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b  # pins v4
        with:
          # Fails the PR on new known vulnerabilities — the org-level policy.
          fail-on-severity: high
          deny-licenses: AGPL-3.0, AGPL-3.0-or-later

  codeql:
    name: CodeQL
    if: inputs.codeql-languages != ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # pins v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@354d3a23c0a0a30518fc36e7ed533bc072f874f6  # pins v3
        with:
          languages: ${{ inputs.codeql-languages }}
          queries: ${{ inputs.codeql-queries }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@354d3a23c0a0a30518fc36e7ed533bc072f874f6  # pins v3

      - name: Analyze
        uses: github/codeql-action/analyze@354d3a23c0a0a30518fc36e7ed533bc072f874f6  # pins v3
